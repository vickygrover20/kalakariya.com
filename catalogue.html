<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Catalogue | Kalakariya®</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    background:#000;
    color:#fff;
}

nav{
    background:#111;
    padding:18px;
    text-align:center;
}

nav a{
    color:#fff;
    text-decoration:none;
    margin:0 18px;
    font-size:18px;
}

nav a:hover{
    color:#b30000;
}

h1{
    text-align:center;
    color:#b30000;
    margin:40px 0;
}

.category{
    width:90%;
    max-width:1300px;
    margin:40px auto;
}

.category h2{
    border-left:5px solid #b30000;
    padding-left:12px;
    margin-bottom:25px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:25px;
}

.card{
    background:#111;
    border:1px solid #222;
    border-radius:10px;
    overflow:hidden;
    transition:.3s;
}

.card:hover{
    transform:translateY(-6px);
    border-color:#b30000;
}

.card img{
    width:100%;
    height:230px;
    object-fit:cover;
}

.content{
    padding:20px;
    text-align:center;
}

.content h3{
    margin-bottom:20px;
}

.btn{
    display:inline-block;
    padding:10px 18px;
    border-radius:5px;
    color:#fff;
    text-decoration:none;
    margin:5px;
}

.view{
    background:#b30000;
}

.download{
    background:#25D366;
}

footer{
    text-align:center;
    padding:40px;
    color:#888;
}

</style>

</head>

<body>

<nav>

<a href="index.html">Home</a>

<a href="about.html">About</a>

</nav>

<h1>Our Catalogue</h1>

<div id="catalogues">

Loading catalogues...

</div>

<footer>

© 2026 Kalakariya®

</footer>

<script>

fetch("catalogue/catalogue.json")

.then(function(response){

    if(!response.ok){

        throw new Error("Cannot load catalogue.json");

    }

    return response.json();

})

.then(function(data){

    const container=document.getElementById("catalogues");

    container.innerHTML="";

    data.forEach(function(category){

        let section=document.createElement("div");

        section.className="category";

        let html="";

        html+="<h2>"+category.category+"</h2>";

        html+="<div class='grid'>";

        category.catalogues.forEach(function(item){

            html+=`

            <div class="card">

                <img src="${item.cover}" alt="${item.title}">

                <div class="content">

                    <h3>${item.title}</h3>

                    <a class="btn view"
                       href="${item.pdf}"
                       target="_blank">

                       View Catalogue

                    </a>

                    <a class="btn download"
                       href="${item.pdf}"
                       download>

                       Download

                    </a>

                </div>

            </div>

            `;

        });

        html+="</div>";

        section.innerHTML=html;

        container.appendChild(section);

    });

})

.catch(function(error){

    console.error(error);

    document.getElementById("catalogues").innerHTML=

    "<h2 style='text-align:center;color:red'>Unable to load catalogue.</h2>";

});

</script>

</body>

</html>
